; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_port = COM3
monitor_port = COM3

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLOG_LEVEL=4

lib_deps =
    zinggjm/GxEPD2
    adafruit/Adafruit GFX Library
    adafruit/Adafruit NeoPixel@^1.15.1
    witnessmenow/UniversalTelegramBot
    bblanchon/ArduinoJson

; Host environment: runs the logic layer and Application on the laptop,
; with no board attached. Hardware-only sources are excluded because they
; pull in Arduino and third-party device libraries.
[env:native]
platform = native
platform_packages =
    platformio/toolchain-gccmingw32
extra_scripts =
    pre:scripts/native_toolchain.py

test_build_src = true

build_flags =
    -std=gnu++11
    -DLOG_LEVEL=1

build_src_filter =
    +<*>
    -<main.cpp>
    -<Display/EpaperDisplay.cpp>
    -<Display/EpaperDisplayRenderer.cpp>
    -<Communication/SerialMessageSource.cpp>
    -<Communication/TelegramMessageSource.cpp>
    -<Touch/GpioTouchSensor.cpp>
    -<Led/NeoPixelLed.cpp>
    -<Storage/NvsMessageStorage.cpp>
    -<Network/>
